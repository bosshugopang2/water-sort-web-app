<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Sort Puzzle Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Water Sort Puzzle Solver</h1>

    <div class="panel">
      <label for="puzzleInput">Puzzle JSON</label>
      <textarea id="puzzleInput" rows="18">{
  "bottles": [
    ["GREEN", "RED", "RED", "RED"],
    ["GREEN", "GREEN", "GREEN", "RED"],
    ["EMPTY", "EMPTY", "EMPTY", "EMPTY"]
  ]
}</textarea>

      <div class="actions">
        <button id="solveBtn">Solve</button>
        <button id="loadExampleBtn" class="secondary">Load Example</button>
      </div>
    </div>

    <div class="panel">
      <h2>Solution</h2>
      <div id="status">Waiting for input...</div>
      <ol id="movesList"></ol>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
