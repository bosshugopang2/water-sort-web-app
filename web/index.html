<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Sort Puzzle Game + Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Water Sort Puzzle</h1>
      <div class="status" id="statusText">Select a bottle to move from.</div>
    </header>

    <section class="controls">
      <button id="resetBtn">Reset</button>
      <button id="exampleBtn">Example Puzzle</button>
      <button id="solveBtn" class="primary">Solve for Me</button>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="Water sort board"></div>
    </section>

    <section class="solution-panel">
      <h2>Solution</h2>
      <ol id="movesList"></ol>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
